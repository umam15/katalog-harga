; Konfigurasi OPcache untuk aplikasi ini. Di-copy ke conf.d/ lewat Dockerfile.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
; 1 + revalidate_freq=2 detik: cukup sering ngecek perubahan file supaya aman
; untuk update manual di server, tapi tetap jauh lebih cepat daripada parse
; ulang setiap request. Set ke 0 untuk performa maksimal kalau deploy selalu
; lewat rebuild image (docker compose up -d --build).
opcache.validate_timestamps=1
opcache.revalidate_freq=2
